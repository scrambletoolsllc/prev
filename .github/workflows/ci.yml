name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev desktop-file-utils appstream dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Render regression
        run: |
          scripts/fetch-render-corpus.sh "$RUNNER_TEMP/corpus"
          cargo test -p prev-pdf --test render_regression
        env:
          PREV_CORPUS: ${{ runner.temp }}/corpus
          PREV_CORPUS_REQUIRED: 1
      # The Flatpak builds offline from this list of crates.
      - run: scripts/check-cargo-sources.py
      - run: desktop-file-validate data/*.desktop
      # The app id is run.prev, prev.run reversed, where the validator
      # looks for three parts.
      - run: appstreamcli validate --no-net --override=cid-desktopapp-is-not-rdns=info data/*.metainfo.xml

  macos:
    # Apple Silicon. The release job adds the decode-only libheif.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: libclang for bindgen
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >>"$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: App and disk image
        run: packaging/macos/bundle.sh --dmg
      - name: Check that it runs
        run: target/macos/prev-dev.app/Contents/MacOS/prev --version
      - uses: actions/upload-artifact@v4
        with:
          name: prev-macos
          path: target/macos/*.dmg

  windows:
    runs-on: windows-2025
    env:
      # bindgen finds MuPDF's headers through the runner's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Pick the MSVC toolset for MuPDF
        shell: pwsh
        run: packaging\windows\msvc-toolset.ps1
      - name: Point bindgen at clang's headers
        shell: pwsh
        run: packaging\windows\bindgen-headers.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p prev
      # HEIC and AVIF: one heif.dll with the HEVC (libde265) and AV1 (aom)
      # decoders linked in and no encoders, from pinned vcpkg ports. prev
      # loads it from beside prev.exe.
      - uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-libheif-x64-${{ hashFiles('packaging/windows/vcpkg/**') }}
      - name: libheif
        run: vcpkg install --x-manifest-root=packaging\windows\vcpkg --x-install-root=vcpkg_installed --triplet x64-windows-prev
      # With the Visual C++ runtime they load, as the release has them.
      - name: Collect prev.exe and its DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\prev.exe dist\
          Copy-Item vcpkg_installed\x64-windows-prev\bin\heif.dll dist\
          python -m pip install --quiet pefile
          python packaging\windows\check-dlls.py dist --bundle-crt x64
          if ($LASTEXITCODE -ne 0) { throw "check-dlls.py failed" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: prev-windows
          path: dist/*
      # The installer and zip, to try the packaging before a release.
      - name: Installer and zip
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          packaging\windows\build.ps1 -Version $version -Source dist -Out packages
      - uses: actions/upload-artifact@v4
        with:
          name: prev-windows-packages
          path: packages/*

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
