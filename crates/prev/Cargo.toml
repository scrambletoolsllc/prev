[package]
name = "prev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Embeds the icon and version details on Windows; see build.rs.
[build-dependencies]
winresource = "0.1"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iced = { version = "0.14", features = ["advanced", "canvas", "highlighter", "image-without-codecs", "markdown"] }
iced_runtime = "0.14"
scramble-ui.workspace = true
# The interface's text, from i18n/<language>/prev.ftl (Project Fluent).
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
resvg = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
tempfile = "3"
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
tiny-skia = "0.11"
toml = "1"
usvg = "0.46"
prev-image.workspace = true
prev-pdf.workspace = true
prev-store.workspace = true
prev-assist.workspace = true
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "sync"] }
schemars = "1"
base64 = "0.22"


# The desktop portal and Wayland drag and drop; Windows has its own side
# in each module that uses them.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser", "open_uri", "print"] }
smithay-clipboard = "0.7"
# iced's own winit, for the keyboard layout it reads (patched, see
# vendor/PATCHES.md).
winit = { version = "0.30", default-features = false, features = ["wayland", "x11"] }

# A print portal of the tests' own, on a bus of their own.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }

# The pasteboard, and later the app delegate and printing.
[target.'cfg(target_os = "macos")'.dependencies]
# iced's own winit, for the files Finder opens (patched, see
# vendor/PATCHES.md).
winit = { version = "0.30", default-features = false }
muda = { version = "0.20", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSPrintInfo", "NSPrintOperation", "NSPrintPanel", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSURL", "NSDictionary", "NSGeometry", "NSObjCRuntime", "NSRange", "NSString", "NSUserDefaults"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
