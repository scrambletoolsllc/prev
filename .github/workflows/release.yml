name: Release

# A tag such as v1.0.0 builds every package and drafts a GitHub release
# with them. Running the workflow by hand builds the same packages, or
# only those of one system, without a release, to try the packaging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: Packages to build
        type: choice
        options: [all, linux, flatpak, windows, macos]
        default: all

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.43.0

jobs:
  packages:
    # Built on an older system so the packages run on newer ones too.
    # GitHub has no RISC-V runners, so that build is cross-compiled; there
    # is no AppImage for it, as appimagetool has no RISC-V build.
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            deb: amd64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            deb: arm64
          - arch: riscv64
            runner: ubuntu-22.04
            deb: riscv64
            target: riscv64gc-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: ${{ !matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev desktop-file-utils file libfuse2
      - name: Install the cross toolchain and libraries
        if: ${{ matrix.target }}
        run: scripts/cross-setup.sh ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # The AppStream metadata is validated by CI, on a newer Ubuntu whose
      # appstreamcli knows the current format.
      - name: Check the desktop entry
        run: desktop-file-validate data/*.desktop
      - name: Build
        id: build
        run: |
          if [ -n "$TARGET" ]; then
            cargo build --release --locked -p prev --target "$TARGET"
            echo "binary=target/$TARGET/release/prev" >>"$GITHUB_OUTPUT"
          else
            cargo build --release --locked -p prev
            echo "binary=target/release/prev" >>"$GITHUB_OUTPUT"
          fi
        env:
          PREV_PRODUCTION: '1'
          TARGET: ${{ matrix.target }}
      - name: Check that it runs
        run: |
          if [ -n "$TARGET" ]; then
            qemu-${{ matrix.arch }}-static -L / ${{ steps.build.outputs.binary }} --version
          else
            ${{ steps.build.outputs.binary }} --version
          fi
        env:
          TARGET: ${{ matrix.target }}
      - name: Stage
        run: scripts/dist-install.sh ${{ steps.build.outputs.binary }} stage /usr
      - name: Debian and RPM packages
        run: |
          curl -sSLf -o nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_$(dpkg --print-architecture).deb"
          sudo dpkg -i nfpm.deb
          mkdir -p dist
          export VERSION=${{ steps.version.outputs.version }}
          ARCH=${{ matrix.deb }} nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          ARCH=${{ matrix.arch }} nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
      - name: AppImage
        if: ${{ !matrix.target }}
        run: |
          curl -sSLf -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL=$PWD/appimagetool packaging/appimage/build.sh \
            ${{ steps.build.outputs.binary }} ${{ steps.version.outputs.version }} dist
      - name: Plain binary
        run: |
          tar -C stage -czf dist/prev-${{ steps.version.outputs.version }}-${{ matrix.arch }}-linux.tar.gz usr
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  flatpak:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'flatpak' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: prev-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.scrambletools.prev.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: prev-${{ matrix.arch }}.flatpak

  windows:
    # prev.exe with its HEIC and AVIF DLLs, the MSI installer and a zip.
    # Microsoft's Azure Artifact Signing signs prev.exe and the MSI once
    # the repository variable AZURE_SIGNING_ACCOUNT is set (see
    # docs/RELEASING.md); until then the files are unsigned. The job signs
    # in to Azure with GitHub's OpenID Connect token, so no secret is
    # kept, as the environment "release" that Azure trusts.
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'windows' }}
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      SIGNING: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Pick the MSVC toolset for MuPDF
        shell: pwsh
        run: packaging\windows\msvc-toolset.ps1
      - name: Point bindgen at clang's headers
        shell: pwsh
        run: packaging\windows\bindgen-headers.ps1
      - name: Let mupdf-sys build for ARM64
        if: matrix.arch == 'arm64'
        run: |
          cargo fetch --locked
          packaging\windows\mupdf-sys-arm64.ps1
      - name: Build
        run: cargo build --release --locked -p prev
        env:
          PREV_PRODUCTION: '1'
      # prev.exe is a Windows GUI program, which PowerShell would not wait
      # for.
      - name: Check that it runs
        shell: pwsh
        run: |
          $run = Start-Process target\release\prev.exe -ArgumentList --version -Wait -PassThru -NoNewWindow -RedirectStandardOutput version.txt
          $version = Get-Content -Raw version.txt
          Write-Host $version
          if ($run.ExitCode -ne 0 -or $version -notmatch '^prev \d') { throw "prev.exe --version failed" }
      # One heif.dll, decoding only, from pinned vcpkg ports.
      - uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-libheif-${{ matrix.arch }}-${{ hashFiles('packaging/windows/vcpkg/**') }}
      - name: libheif
        run: vcpkg install --x-manifest-root=packaging\windows\vcpkg --x-install-root=vcpkg_installed --triplet ${{ matrix.arch }}-windows-prev
      # With the Visual C++ runtime they load, which a Windows without its
      # Redistributable lacks; the check fails if they load any other DLL
      # that neither ships nor comes with Windows.
      - name: Collect prev.exe and its DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\prev.exe dist\
          Copy-Item vcpkg_installed\${{ matrix.arch }}-windows-prev\bin\heif.dll dist\
          python -m pip install --quiet pefile
          python packaging\windows\check-dlls.py dist --bundle-crt ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw "check-dlls.py failed" }
          Get-ChildItem dist
      - if: env.SIGNING == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Signs prev.exe itself, before the installer and zip take it; the
      # bundled DLLs stay as their projects ship them.
      - if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\prev.exe
          description: prev
          description-url: https://prev.run
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          # Its cache of the signing module, shared by both architectures,
          # has come back without the module; downloading costs a minute.
          cache-dependencies: false
      - name: Installer and zip
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          packaging\windows\build.ps1 -Version $version -Source dist -Out packages -Arch ${{ matrix.arch }}
      - if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\packages
          files-folder-filter: msi
          description: prev
          description-url: https://prev.run
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          # Its cache of the signing module, shared by both architectures,
          # has come back without the module; downloading costs a minute.
          cache-dependencies: false
      # The signatures, checked: an unsigned file must not go out as a
      # signed release.
      - if: env.SIGNING == 'true'
        name: Check the signatures
        shell: pwsh
        run: |
          foreach ($file in @(Get-Item dist\prev.exe) + @(Get-ChildItem packages\*.msi)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not signed" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: packages/*

  macos:
    # prev.app in a disk image, for Apple Silicon, signed ad hoc until a
    # Developer ID signature and notarization are set up.
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'macos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - uses: actions/cache@v4
        with:
          path: target/libheif
          key: libheif-macos-${{ hashFiles('packaging/macos/build-libheif.sh') }}
      - name: libheif, decode only
        run: |
          command -v ninja >/dev/null || brew install ninja
          packaging/macos/build-libheif.sh
      - name: App and disk image
        run: packaging/macos/bundle.sh --dmg --out dist
        env:
          PREV_PRODUCTION: '1'
      - name: Check that it runs
        run: |
          version=$(dist/prev.app/Contents/MacOS/prev --version)
          echo "$version"
          [[ $version == prev\ [0-9]* ]]
          otool -L dist/prev.app/Contents/Frameworks/libheif.1.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg

  aur:
    # The AUR package builds from GitHub's source archive of the tag; its
    # checksum is only known once the tag exists.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PKGBUILD with the source checksum
        run: |
          curl -sSLf -o source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          mkdir -p aur
          sed "s/^sha256sums=('SKIP')/sha256sums=('$sum')/" packaging/arch/prev/PKGBUILD >aur/PKGBUILD
          cp packaging/arch/prev/prev.install aur/
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: aur/*

  release:
    if: github.ref_type == 'tag'
    needs: [packages, flatpak, aur, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and notes
        run: |
          mkdir -p upload
          cp artifacts/packages-*/* artifacts/flatpak-*/* artifacts/windows-*/* artifacts/macos-*/* upload/
          # The PKGBUILD and its install file, to build the Arch package.
          cp artifacts/aur/* upload/
          (cd upload && sha256sum * >SHA256SUMS)
          version=${GITHUB_REF_NAME#v}
          # This version's section of the changelog, without its heading.
          awk -v version="$version" '
            /^## / { found = index($0, "[" version "]") > 0; next }
            found' CHANGELOG.md >notes.md
      - name: Draft the release
        run: |
          gh release create "$GITHUB_REF_NAME" upload/* \
            --draft --title "prev ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
