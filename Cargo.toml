[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "2.2.3"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/scrambletools/prev"

[workspace.dependencies]
prev-image = { path = "crates/prev-image", version = "2.2.2" }
prev-pdf = { path = "crates/prev-pdf", version = "2.2.2" }
prev-store = { path = "crates/prev-store", version = "2.2.2" }
prev-assist = { path = "crates/prev-assist", version = "2.2.2" }
# Material Design 3 for iced, shared by Scramble Tools apps.
scramble-ui = { git = "https://github.com/scrambletools/scramble-ui", rev = "1b57adae70aab7efc4e57d1a777d295acc45b46b", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Adds file drag and drop to the clipboard's data device; see vendor/PATCHES.md.
[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }
# Right to left text in text inputs; the copies live with scramble-ui, see
# its vendor/PATCHES.md.
iced_graphics = { git = "https://github.com/scrambletools/scramble-ui", rev = "1b57adae70aab7efc4e57d1a777d295acc45b46b" }
iced_widget = { git = "https://github.com/scrambletools/scramble-ui", rev = "1b57adae70aab7efc4e57d1a777d295acc45b46b" }
# The keyboard layout in use, for the side empty text fields start on; see
# vendor/PATCHES.md.
winit = { path = "vendor/winit" }
