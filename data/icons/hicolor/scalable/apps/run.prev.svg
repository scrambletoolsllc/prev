<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f7"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fe0"/>
      <stop offset="1" stop-color="#9fd3f5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8fb5"/>
      <stop offset="1" stop-color="#37b7c9"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dfa4"/>
      <stop offset="1" stop-color="#e9c77e"/>
    </linearGradient>
    <clipPath id="scene">
      <rect x="-39.0" y="-28.5" width="78" height="57" rx="2"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#1c2a45" flood-opacity="0.32"/>
    </filter>
    <filter id="photoshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.6" flood-color="#1c2a45" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- the document -->
  <g transform="translate(2 0)">
  <g filter="url(#shadow)">
    <path d="M45 8 H95 L115 28 V114 a6 6 0 0 1 -6 6 H45 a6 6 0 0 1 -6 -6 V14 a6 6 0 0 1 6 -6 Z" fill="url(#paper)"/>
  </g>
  <path d="M95 8 V22 a6 6 0 0 0 6 6 H115 Z" fill="#d5dcea"/>
  <!-- text lines -->
  <rect x="55" y="82" width="50" height="3.2" rx="1.6" fill="#b3bccd"/>
  <rect x="55" y="90" width="40" height="3.2" rx="1.6" fill="#b3bccd"/>
  <!-- signature -->
  <path d="M51 108 L107 108" stroke="#c3cad8" stroke-width="1.4" stroke-linecap="round"/>
  <g transform="translate(9 4)">
    <path d="M44 102 C46 92 50 90 51 95 C52 100 49 104 47 101 C45 98 52 94 55 97 C57 99 56 102 58 100 C60 97 61 94 63 96 C64 98 63 101 65 100 C68 98 70 93 72 95 C73 97 72 100 75 99 C79 97 84 95 90 97"
          fill="none" stroke="#2548a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>

  <!-- the photo, laid on top at an angle -->
  <g transform="translate(53 44) rotate(-11)" filter="url(#photoshadow)">
    <rect x="-44.0" y="-33.5" width="88" height="67" rx="3.2" fill="#ffffff"/>
    <g clip-path="url(#scene)">
      <rect x="-39.0" y="-28.5" width="78" height="57" fill="url(#sky)"/>
      <circle cx="18.7" cy="-12.5" r="7.8" fill="#ffe27a"/>
      <rect x="-39.0" y="0" width="78" height="15.4" fill="url(#sea)"/>
      <path d="M-39.0 5.7 C-30.4 2.9 -24.2 8.5 -15.6 5.7 C-7.0 2.9 -0.8 8.5 7.8 5.7 C16.4 2.9 22.6 8.5 31.2 5.7 C35.1 4.6 37.4 5.7 39.0 5.7" fill="none" stroke="#bfe9f2" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-39.0 17.7 C-19.5 11.4 7.8 12.5 39.0 16.0 V28.5 H-39.0 Z" fill="url(#sand)"/>
    </g>
  </g>
</svg>
